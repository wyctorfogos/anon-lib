[pytest]
testpaths = tests
pythonpath = src
markers =
    llm: exercita o Ollama de verdade (regressao de prompt). Rode com: pytest -m llm
# Os plugins pytest do faker e do hypothesis instalados neste ambiente quebram
# na importação sob Python 3.8 (typing não-subscriptável / pydantic._hypothesis_plugin
# ausente). Nenhum dos dois é usado pelos testes, então desligamos o autoload deles.
# -m "not llm": a suíte padrão fica hermética e sem rede; veja o bloco de
# regressão de prompt no fim do arquivo de testes.
addopts = -p no:faker -p no:hypothesispytest -m "not llm"
