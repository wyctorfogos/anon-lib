name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Espelha os classifiers e o requires-python do pyproject.toml: a matriz
        # e o que torna ">=3.8" uma afirmacao verificada, e nao so declarada.
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar o pacote com as dependencias de desenvolvimento
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Sem Ollama no runner: o marcador llm ja sai desmarcado por addopts,
      # entao roda so a suite hermetica.
      - name: Rodar os testes
        run: pytest -v
