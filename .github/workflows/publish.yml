name: publish

# Publica ao criar um Release no GitHub. Trusted Publishing (OIDC) dispensa
# token de API: a autenticacao vem do proprio workflow.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs le a versao das tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o pacote com as dependencias de desenvolvimento
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build twine

      # Publicar uma versao quebrada e irreversivel: o numero fica queimado.
      - name: Rodar os testes antes de empacotar
        run: pytest -v

      - name: Construir sdist e wheel
        run: |
          rm -rf dist
          python -m build

      - name: Validar os artefatos
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
